name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy
      - name: Tests
        env:
          TZ: UTC  # the bot must not depend on the host time zone
        run: python -m unittest discover -s tests -v

  whatsapp-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whatsapp_service/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: node --check server.js && node --check auth_state.js
      - name: Known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
