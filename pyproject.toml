[project]
name = "uni-oldenburg-study-assistant"
version = "1.0.0"
description = "Telegram study assistant for Stud.IP at the University of Oldenburg"
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies are pinned in requirements.txt (the bot is deployed
# from a checkout, not installed as a package).

[tool.ruff]
target-version = "py310"
extend-exclude = ["whatsapp_service"]

[tool.ruff.lint]
# F: pyflakes (undefined names, unused imports, ...)
# E9: syntax errors          B: likely bugs (bugbear)
# G004: f-strings in log calls (use lazy %-formatting)
# S110/S112, E722: exceptions swallowed without a trace
select = ["F", "E9", "B", "G004", "S110", "S112", "E722"]
# zip() over lists built side by side; strict=True would turn a harmless
# length mismatch into a crash.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ re-exports config on purpose (it must load first).
"unibot/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
# Every module of the bot is listed (tests and scripts are not).
# Imported modules are analysed but not reported.
follow_imports = "silent"
files = [
    "studip_http.py",
    "stums_parsers.py",
    "studip_utils.py",
    "unibot/__init__.py",
    "unibot/config.py",
    "unibot/db.py",
    "unibot/state.py",
    "unibot/diagnostics.py",
    "unibot/watcher.py",
    "unibot/storage.py",
    "unibot/formatting.py",
    "unibot/telegram_ui.py",
    "unibot/auth.py",
    "unibot/studip_api.py",
    "unibot/monitoring_fetch.py",
    "unibot/monitoring_diff.py",
    "unibot/monitoring_alerts.py",
    "unibot/monitoring.py",
    "studip_session.py",
    "studip_sso.py",
    "studip_login_server.py",
    "studip_tunnel.py",
    "stums_client.py",
    "exam_reminder.py",
    "fast_enroll.py",
    "studip_bot.py",
    "studip_oauth.py",
    "studip_vault.py",
    "unibot/ai.py",
    "unibot/app.py",
    "unibot/weather.py",
    "unibot/documents.py",
    "unibot/morning.py",
    "unibot/whatsapp.py",
    "unibot/system.py",
    "unibot/voice.py",
    "unibot/study_plan.py",
    "unibot/study_day.py",
    "unibot/schedule.py",
    "unibot/tasks.py",
    "unibot/study_week.py",
    "unibot/course_registry.py",
    "unibot/stagger.py",
    "unibot/privacy.py",
    "unibot/preferences.py",
    "unibot/settings_menu.py",
    "unibot/mensa.py",
    "unibot/wardrobe.py",
    "unibot/menus.py",
    "unibot/enrollment.py",
    "unibot/exams.py",
]

# The Telegram feature modules read python-telegram-bot objects that are typed
# Optional for update kinds these handlers never receive (update.callback_query
# in a callback handler, query.message, query.data, context.user_data). Only
# that one check is off there; every other check still applies, and
# non-Telegram Optionals in these modules were fixed instead of silenced.
[[tool.mypy.overrides]]
module = [
    "unibot.app",
    "unibot.weather",
    "unibot.documents",
    "unibot.morning",
    "unibot.whatsapp",
    "unibot.system",
    "unibot.voice",
    "unibot.study_plan",
    "unibot.schedule",
    "unibot.tasks",
    "unibot.study_week",
    "unibot.course_registry",
    "unibot.privacy",
    "unibot.settings_menu",
    "unibot.mensa",
    "unibot.wardrobe",
    "unibot.menus",
    "unibot.enrollment",
    "unibot.exams",
]
disable_error_code = ["union-attr"]

[tool.coverage.run]
source = ["unibot", "studip_utils", "studip_session", "studip_oauth", "studip_vault", "studip_http", "stums_parsers", "stums_client", "exam_reminder"]
