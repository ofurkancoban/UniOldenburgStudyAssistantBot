name = "uni-oldenburg-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
# keep variables set in the Cloudflare dashboard (a deploy would drop them)
keep_vars = true

# PROXY_SECRET is a secret, never a plain [vars] entry: a [vars] value would
# overwrite the deployed secret on every `wrangler deploy` and lock the bot out.
# Set it once with:  npx wrangler secret put PROXY_SECRET
